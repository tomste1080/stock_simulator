<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <div class="card mb-2 shadow-sm">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <h4 class="mb-0">Stock Simulator</h4>

                        <span id="status" class="badge bg-secondary">Łączenie…</span>

                        <div class="d-flex align-items-center gap-2">
                            <label for="user-id" class="mb-0 text-muted small">Użytkownik ID</label>
                            <input id="user-id" type="number" min="1" value="1"
                                   class="form-control form-control-sm" style="width: 80px">
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="card-title">
                            <h5>Ceny na żywo</h5>
                        </div>
                        <table class="table">
                            <thead>
                            <tr>
                                <th class="symbol-cell" scope="col">Symbol</th>
                                <th class="price-cell text-end" scope="col">Cena</th>
                                <th class="change-cell text-end" scope="col">Zmiana</th>
                            </tr>
                            </thead>
                            <tbody id="prices-body">
                            </tbody>
                        </table>
                        <p>Kliknięcie wiersza zmienia wykres</p>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <h5 id="chart-title" class="card-title mb-0">Wykres</h5>
                            <div class="d-flex gap-1">
                                <button type="button" class="btn btn-sm btn-outline-primary" data-minutes="5">5 min</button>
                                <button type="button" class="btn btn-sm btn-outline-primary active" data-minutes="15">15 min</button>
                                <button type="button" class="btn btn-sm btn-outline-primary" data-minutes="60">1 h</button>
                            </div>
                        </div>
                        <div style="position: relative; height: 300px">
                            <canvas id="price-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-12 mt-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="card-title">
                            <h5>Portfel</h5>
                        </div>
                        <table class="table">
                            <thead>
                            <tr>
                                <th class="symbol-cell" scope="col">Symbol</th>
                                <th class="quantity-cell" scope="col">Ilość</th>
                                <th class="average-price-cell" scope="col">Śr. cena</th>
                                <th class="price-cell">Cena</th>
                                <th class="total-price-cell">Wartość</th>
                                <th class="profit-cell">Zysk/Strata</th>
                            </tr>
                            </thead>
                            <tbody id="holdings-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="col-md-12 mt-3">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <div class="card-title">
                            <h5>Zlecenia</h5>
                        </div>
                        <table class="table">
                            <thead>
                            <tr>
                                <th class="id-cell" scope="col">ID</th>
                                <th class="symbol-cell" scope="col">Symbol</th>
                                <th class="type-cell" scope="col">Typ</th>
                                <th class="status-cell" scope="col">Status</th>
                                <th class="trigger-price-cell" scope="col">Próg</th>
                                <th class="quantity-cell" scope="col">Ilość</th>
                                <th class="executed-cell" scope="col">Wykonane</th>
                            </tr>
                            </thead>
                            <tbody id="orders-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>

        let selectedAssetId = null;
        let selectedMinutes = 15;
        let latestAssets = [];

        const chart = new Chart(document.getElementById('price-chart'), {
            type: 'line',
            data: {
                labels: [],
                datasets: [{ data: [], borderColor: '#0d6efd', borderWidth: 2, pointRadius: 0, tension: 0.2 }]
            },
            options: {
                animation: false,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { x: { ticks: { maxTicksLimit: 8 } } }
            }
        });

        function formatPrice(value) {
            return value.toLocaleString('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2,  useGrouping: 'always'  });
        }

        const previousPrices = {};

        function renderPrices(assets) {
            const tbody = document.getElementById('prices-body');
            tbody.innerHTML = assets.map(asset => {
                const previous = previousPrices[asset.id] ?? asset.currentPrice;
                const change = asset.currentPrice - previous;
                const changePercent = previous !== 0 ? (change / previous) * 100 : 0;

                const colorClass = change > 0 ? 'text-success' : change < 0 ? 'text-danger' : '';
                const arrow = change > 0 ? '▲' : change < 0 ? '▼' : '';

                previousPrices[asset.id] = asset.currentPrice;

                return `
            <tr data-id="${asset.id}" class="${asset.id === selectedAssetId ? 'table-active' : ''}" style="cursor: pointer">
                <td><strong>${asset.symbol}</strong></td>
                <td class="text-end">${formatPrice(asset.currentPrice)}</td>
                <td class="text-end ${colorClass}">
                    ${arrow} ${Math.abs(changePercent).toLocaleString('pl-PL', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}%
                </td>
            </tr>
        `;
            }).join('');
        }

        async function loadHistory() {
            if (selectedAssetId === null) return;
            const asset = latestAssets.find(a => a.id === selectedAssetId);
            document.getElementById('chart-title').textContent = asset ? `${asset.symbol} – ${asset.name}` : 'Wykres';

            const response = await fetch(`/api/assets/${selectedAssetId}/prices?minutes=${selectedMinutes}`);
            const ticks = await response.json();
            chart.data.labels = ticks.map(t => formatTime(t.timestamp));
            chart.data.datasets[0].data = ticks.map(t => t.price);
            chart.update();
        }

        function addChartPoint(assets) {
            const asset = assets.find(a => a.id === selectedAssetId);
            if (!asset) return;
            chart.data.labels.push(formatTime(asset.priceUpdatedAt));
            chart.data.datasets[0].data.push(asset.currentPrice);
            if (chart.data.labels.length > 720) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }
            chart.update();
        }

        function selectAsset(id) {
            selectedAssetId = id;
            document.querySelectorAll('#prices-body tr').forEach(row => {
                row.classList.toggle('table-active', Number(row.dataset.id) === id);
            });
            loadHistory();
        }

        document.getElementById('prices-body').addEventListener('click', event => {
            const row = event.target.closest('tr');
            if (row) selectAsset(Number(row.dataset.id));
        });

        document.querySelectorAll('[data-minutes]').forEach(button => {
            button.addEventListener('click', () => {
                document.querySelectorAll('[data-minutes]').forEach(b => b.classList.remove('active'));
                button.classList.add('active');
                selectedMinutes = Number(button.dataset.minutes);
                loadHistory();
            });
        });

        async function loadAssets() {
            const response = await fetch('/api/assets');
            const assets = await response.json();
            latestAssets = assets;
            renderPrices(assets);
            if (selectedAssetId === null && assets.length > 0) {
                selectAsset(assets[0].id);
            }
        }

        loadAssets();

        function getUserId() {
            return document.getElementById('user-id').value;
        }

        function formatQuantity(value) {
            return value.toLocaleString('pl-PL', { maximumFractionDigits: 8 });
        }

        function formatTime(value) {
            return value ? new Date(value).toLocaleTimeString('pl-PL') : '—';
        }

        async function loadHoldings() {
            const tbody = document.getElementById('holdings-body');
            const response = await fetch(`/api/users/${getUserId()}/holdings`);
            if (!response.ok) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-muted">Brak danych (${response.status})</td></tr>`;
                return;
            }
            const holdings = await response.json();
            if (holdings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-muted">Portfel jest pusty</td></tr>';
                return;
            }
            tbody.innerHTML = holdings.map(h => {
                const profitClass = h.profitLoss > 0 ? 'text-success' : h.profitLoss < 0 ? 'text-danger' : '';
                return `
            <tr>
                <td><strong>${h.symbol}</strong></td>
                <td class="text-end">${formatQuantity(h.quantity)}</td>
                <td class="text-end">${formatPrice(h.averageBuyPrice)}</td>
                <td class="text-end">${formatPrice(h.currentPrice)}</td>
                <td class="text-end">${formatPrice(h.currentValue)}</td>
                <td class="text-end ${profitClass}">${formatPrice(h.profitLoss)}</td>
            </tr>
        `;
            }).join('');
        }

        const statusBadges = {
            ACTIVE: 'bg-primary',
            EXECUTED: 'bg-success',
            FAILED: 'bg-danger',
            CANCELLED: 'bg-secondary'
        };

        async function loadOrders() {
            const tbody = document.getElementById('orders-body');
            const response = await fetch(`/api/users/${getUserId()}/orders`);
            if (!response.ok) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-muted">Brak danych (${response.status})</td></tr>`;
                return;
            }
            const orders = await response.json();
            if (orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-muted">Brak zleceń</td></tr>';
                return;
            }
            tbody.innerHTML = orders.map(o => `
        <tr>
            <td>${o.id}</td>
            <td><strong>${o.symbol}</strong></td>
            <td>${o.orderType}</td>
            <td><span class="badge ${statusBadges[o.orderStatus]}">${o.orderStatus}</span></td>
            <td class="text-end">${formatPrice(o.triggerPrice)}</td>
            <td class="text-end">${formatQuantity(o.quantity)}</td>
            <td>${formatTime(o.executedAt)}</td>
        </tr>
    `).join('');
        }

        function refreshUserData() {
            loadHoldings();
            loadOrders();
        }

        refreshUserData();
        document.getElementById('user-id').addEventListener('change', refreshUserData);

        const source = new EventSource('/api/prices/stream');

        source.addEventListener('prices', event => {
            const assets = JSON.parse(event.data);
            latestAssets = assets;
            renderPrices(assets);
            addChartPoint(assets);
            refreshUserData();
        });

        source.onopen = () => {
            const status = document.getElementById('status');
            status.textContent = 'Połączono';
            status.className = 'badge bg-success';
        };

        source.onerror = () => {
            const status = document.getElementById('status');
            status.textContent = 'Brak połączenia';
            status.className = 'badge bg-danger';
        };
    </script>
</body>
</html>
